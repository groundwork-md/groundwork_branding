# Verification only: no deployment step in this file. Runs on a GitHub-hosted runner
# (never a self-hosted one: this repository is public). Regenerates the SVG logo masters with
# the pinned Python generator and fails when a committed master differs. The PNG exports are
# not byte-checked here (they depend on the rasteriser); `npm test` checks their sizes.
name: logo

on:
  push:
    branches: [development, production]
  pull_request:

permissions:
  contents: read

jobs:
  logo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Install the pinned generator dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-virtualenv -r tool/requirements.txt
      - name: Fail if a committed SVG master is stale
        run: PATH="$RUNNER_TEMP/venv/bin:$PATH" npm run check:logo
