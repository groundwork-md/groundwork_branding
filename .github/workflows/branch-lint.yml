# Verification only: no deployment step in this file. Runs on a GitHub-hosted runner
# (never a self-hosted one: this repository is public). Toolchain: `.github/actions/setup`.
# Checks the pushed or PR branch's own name.
name: branch-lint

on:
  push:
    branches: [development, production]
  pull_request:

permissions:
  contents: read

jobs:
  branch-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - run: npm run check:branch -- "$BRANCH"
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
